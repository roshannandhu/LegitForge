# Deploys web/ to Cloudflare Workers (OpenNext) on every push to main-exh9xw, or by hand
# (Actions → Deploy to Cloudflare → Run workflow). First run creates D1 and R2 itself.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (web/README.md).
# Optional repository variable SITE_URL: the real domain, once it points at the Worker.
name: Deploy to Cloudflare

on:
  push:
    branches: [main-exh9xw]
    paths: ['web/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions (see web/README.md)."
            exit 1
          fi

      - run: npm ci

      - name: D1, R2 and the site URL
        run: node scripts/cf-setup.mjs

      - name: Database migrations
        run: npx wrangler d1 migrations apply legitforge --remote

      - name: Build and deploy
        run: npm run deploy

      - name: Worker secrets (first run only)
        run: node scripts/cf-setup.mjs --post

      - name: Live
        run: |
          echo "Live at $LIVE_URL"
          echo "### Live at $LIVE_URL" >> "$GITHUB_STEP_SUMMARY"
