# Weekly health check (PLAN §9.7, §10.8): every Monday 09:00 UTC, or by hand (Actions → Weekly
# check → Run workflow). Runs the backend regression tests on main-exh9xw, then the read-only
# production smoke (scripts/smoke.mjs: health, every public route, robots, sitemap, llms.txt,
# build assets, signed-out admin). It never deploys, signs in or submits a lead.
# A failed run is the alert: GitHub emails whoever last edited this schedule.
# GitHub runs schedules only from the default branch, so this file must be on it too.
name: Weekly check

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main-exh9xw

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Backend regression tests
        run: npm run test:backend

      - name: Read-only production smoke
        env:
          BASE: ${{ vars.SITE_URL || 'https://legitforge.pages.dev' }}
        run: node scripts/smoke.mjs
